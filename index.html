<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="TeoriGuiden hjælper dig med at blive klar til teoriprøven."
    >

    <title>TeoriGuiden</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #1d1d1f;
            background: #f5f5f7;
        }

        main {
            width: 100%;
            max-width: 700px;
            padding: 48px 32px;
            text-align: center;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(2.5rem, 8vw, 4.5rem);
        }

        p {
            margin: 0 auto 30px;
            max-width: 520px;
            font-size: 1.15rem;
            line-height: 1.6;
            color: #555;
        }

        .button {
            display: inline-block;
            padding: 14px 24px;
            color: white;
            font-weight: bold;
            text-decoration: none;
            background: #007aff;
            border-radius: 12px;
        }

        .button:hover {
            background: #0062cc;
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>

<body>
    <main>
        <h1>TeoriGuiden</h1>

        <p>
            Bliv klar til teoriprøven med realistiske teoriprøver,
            skiltequizzer og undervisning i bilens teknik.
        </p>

        <a class="button" href="mailto:kontakt@teoriguiden.dk">
            Kontakt os
        </a>

        <footer>
            © 2026 TeoriGuiden ApS
        </footer>
    </main>
</body>
</html>
